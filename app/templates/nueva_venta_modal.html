<div class="sale-modal-backdrop" id="sale-modal">
<form method="post" action="{{ url_for('nueva_venta') }}" class="sale-form sale-modal-box" id="sale-form">
<header class="sale-form-header"><h1>Nueva Venta</h1><a href="{{ url_for('ventas') }}" class="close-form" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></a></header>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="form-flash {{ category }}"><i class="fa-solid fa-circle-exclamation"></i>{{ message }}</div>{% endfor %}{% endwith %}
<section class="sale-fields"><label class="client-field"><span>Cliente <em>*</em></span><div class="autocomplete" id="client-picker"><input id="client-input" type="search" placeholder="Buscar cliente..." autocomplete="off"><input type="hidden" name="id_cliente" id="client-id"><div class="suggestions" id="client-suggestions"></div></div><div class="client-choice" id="client-choice" hidden><i class="fa-regular fa-user"></i><span>Sin cliente frecuente</span><button type="button" id="restore-client" aria-label="Buscar cliente"><i class="fa-solid fa-xmark"></i></button></div><button type="button" class="frequent-client" id="clear-client">Sin cliente frecuente</button></label><label>Método de Pago<select name="id_metodo_pago" required>{% for metodo in metodos_pago %}<option value="{{ metodo.id }}">{{ metodo.nombre }}</option>{% endfor %}</select></label><label>Registrado por<input value="{{ session.get('full_name', session.get('user', 'Usuario')) }}" disabled></label><label class="observation-field">Observación<textarea name="observaciones" placeholder="Notas adicionales (opcional)..."></textarea></label></section>
<section class="items-section"><div class="items-heading"><span>Repuestos</span><button type="button" id="add-item"><i class="fa-solid fa-plus"></i> Agregar repuesto</button></div><div class="items-head"><span>REPUESTO</span><span>CANTIDAD</span><span>PRECIO</span><span>DESC. Q</span><span>SUBTOTAL</span><span></span></div><div id="items-list"></div></section><section class="sale-total"><span>TOTAL DE LA VENTA</span><strong id="total">Q 0.00</strong></section><footer class="sale-form-actions"><a href="{{ url_for('ventas') }}">Cancelar</a><button type="submit">Registrar Venta</button></footer>
</form></div>
<script>
const saleClients={{ clientes|tojson }},saleProducts={{ repuestos|tojson }};const saleClientInput=document.getElementById('client-input'),saleClientId=document.getElementById('client-id'),saleClientSuggestions=document.getElementById('client-suggestions');
function saleSearch(input,box,list,text,choose){const query=input.value.trim().toLowerCase();box.innerHTML='';if(!query){box.classList.remove('open');return}list.filter(item=>text(item).toLowerCase().includes(query)).slice(0,8).forEach(item=>{const button=document.createElement('button');button.type='button';button.innerHTML=text(item);button.onclick=()=>choose(item);box.appendChild(button)});box.classList.toggle('open',box.children.length>0)}
const clientPicker=document.getElementById('client-picker'),clientChoice=document.getElementById('client-choice');function restoreClient(){clientChoice.hidden=true;clientPicker.hidden=false;saleClientInput.value='';saleClientId.value='';saleClientInput.focus()}saleClientInput.oninput=()=>saleSearch(saleClientInput,saleClientSuggestions,saleClients,c=>`${c.nombre}<small>${c.nit||c.correo||'Sin datos adicionales'}</small>`,c=>{saleClientInput.value=c.nombre;saleClientId.value=c.id;saleClientSuggestions.classList.remove('open');saleClientInput.classList.add('selected')});document.getElementById('clear-client').onclick=()=>{saleClientInput.value='';saleClientId.value='';clientPicker.hidden=true;clientChoice.hidden=false;saleClientSuggestions.classList.remove('open')};document.getElementById('restore-client').onclick=restoreClient;const saleItems=document.getElementById('items-list');const saleMoney=value=>`Q ${Number(value||0).toFixed(2)}`;
function saleTotal(){let total=0;saleItems.querySelectorAll('.item-row').forEach(row=>{const product=saleProducts.find(p=>String(p.id)===row.querySelector('.product-id').value),quantity=Number(row.querySelector('.quantity').value)||0,discount=Number(row.querySelector('.discount').value)||0,subtotal=product?Math.max(0,product.precio*quantity-discount):0;row.querySelector('.price').textContent=product?saleMoney(product.precio):'—';row.querySelector('.subtotal').textContent=saleMoney(subtotal);total+=subtotal});document.getElementById('total').textContent=saleMoney(total)}
function saleAddItem(){const row=document.createElement('div');row.className='item-row';row.innerHTML=`<div class="product-picker autocomplete"><input class="product-input" type="search" placeholder="Buscar repuesto..." autocomplete="off"><input class="product-id" name="id_repuesto[]" type="hidden"><div class="suggestions"></div></div><input class="quantity" name="cantidad[]" type="number" min="1" value="1"><span class="price">—</span><input class="discount" name="descuento[]" type="number" min="0" step="0.01" value="0"><span class="subtotal">Q 0.00</span><button type="button" class="remove-item" title="Quitar repuesto"><i class="fa-solid fa-trash-can"></i></button>`;const input=row.querySelector('.product-input'),id=row.querySelector('.product-id'),box=row.querySelector('.suggestions');input.oninput=()=>saleSearch(input,box,saleProducts,p=>`${p.codigo} — ${p.nombre}<small>Stock: ${p.stock}</small>`,p=>{input.value=`${p.codigo} — ${p.nombre}`;id.value=p.id;input.classList.add('selected');box.classList.remove('open');saleTotal()});row.querySelector('.quantity').oninput=saleTotal;row.querySelector('.discount').oninput=saleTotal;row.querySelector('.remove-item').onclick=()=>{row.remove();saleTotal()};saleItems.appendChild(row)}
document.getElementById('add-item').onclick=saleAddItem;saleAddItem();document.addEventListener('click',event=>{if(!event.target.closest('.autocomplete'))document.querySelectorAll('.suggestions').forEach(box=>box.classList.remove('open'))});document.getElementById('sale-form').onsubmit=event=>{if(!saleClientId.value||!saleItems.querySelector('.product-id[value]')){event.preventDefault();alert('Selecciona un cliente y al menos un repuesto.')}};
</script>
<script>document.getElementById('sale-form').onsubmit=null;document.getElementById('sale-form').addEventListener('submit',event=>{if(!saleItems.querySelector('.product-id[value]')){event.preventDefault();alert('Agrega al menos un repuesto.')}})</script>
